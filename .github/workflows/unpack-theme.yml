name: Unpack Shopify Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack theme ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          echo "Unpacking: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted-theme

          INNER_DIR=$(find extracted-theme -type d -name "assets" -printf '%h\n' | head -n 1)

          if [ -z "$INNER_DIR" ]; then
            echo "Could not find Shopify theme folders."
            exit 1
          fi

          cp -R "$INNER_DIR"/. .
          rm -rf extracted-theme

      - name: Commit extracted theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract Shopify theme files" || exit 0
          git push
